{% extends 'base.html' %}
{% block title %}注册 - 校园活动管理系统{% endblock %}
{% block content %}
<div class="card narrow">
  <h2>注册</h2>
  <form method="post">
    <div class="form-item">
      <label for="username">用户名</label>
      <input type="text" id="username" name="username" required
             value="{{ form.username if form else '' }}">
    </div>
    <div class="form-item">
      <label for="real_name">真实姓名</label>
      <input type="text" id="real_name" name="real_name" required
             value="{{ form.real_name if form else '' }}">
    </div>
    <div class="form-item">
      <label for="role">身份</label>
      <select id="role" name="role">
        <option value="student" {% if form and form.role == 'teacher' %}{% else %}selected{% endif %}>学生</option>
        <option value="teacher" {% if form and form.role == 'teacher' %}selected{% endif %}>教师</option>
      </select>
    </div>
    <div class="form-item">
      <label for="password">密码（至少 6 位）</label>
      <input type="password" id="password" name="password" required minlength="6">
    </div>
    <div class="form-item">
      <label for="confirm">确认密码</label>
      <input type="password" id="confirm" name="confirm" required minlength="6">
    </div>
    <button type="submit" class="btn btn-primary btn-block">注册</button>
    <p class="hint">已有账号？<a href="{{ url_for('auth.login') }}">去登录</a></p>
  </form>
</div>
{% endblock %}
